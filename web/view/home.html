<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.T "home.title"}}</title>
  {{template "head" .}}
  <script src="{{asset "home.js"}}" defer></script>
</head>
<body>
  {{template "nav" .}}
  <main class="mx-auto max-w-screen-xl px-4 py-6">
    <div class="card">
      <div class="card-header">{{.T "home.heading"}}</div>
      <div class="card-body">
        <p>{{.T "home.description"}} <code>{{.Time}}</code></p>
        <p class="mt-4">
          <span id="counter" data-clicked="{{.T "home.clicked"}}" data-times="{{.T "home.times"}}">
            <button type="button" class="btn btn-primary">
              <span class="icon-[lucide--mouse-pointer-click]"></span> {{.T "home.clicked"}} <span>0</span> {{.T "home.times"}}
            </button>
          </span>
        </p>
      </div>
    </div>
  </main>
</body>
</html>
