<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.T "about.title"}}</title>
  {{template "head" .}}
  <script src="{{asset "about.js"}}" defer></script>
</head>
<body>
  {{template "nav" .}}
  <main class="mx-auto max-w-screen-xl px-4 py-6">
    <div class="card">
      <div class="card-header">{{.T "about.heading"}}</div>
      <div class="card-body">
        <p>{{.T "about.description"}}</p>
        <p class="mt-2 text-neutral-400">{{.T "about.bundle"}}</p>
      </div>
    </div>
  </main>
</body>
</html>
