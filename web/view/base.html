{{define "head"}}
<link href="{{asset "main.css"}}" rel="stylesheet">
{{end}}

{{define "nav"}}
<header class="fixed inset-x-0 top-0 z-40 border-b border-neutral-700 bg-neutral-900">
  <div class="flex items-center gap-4 px-4 py-3">
    <a class="flex items-center gap-1.5 text-xl font-semibold text-white" href="/"><span class="icon-[lucide--rocket]"></span> retrogo</a>
    <nav class="me-auto flex gap-1">
      <a class="nav-link{{if eq .Nav "home"}} active{{end}}" href="/"><span class="icon-[lucide--house]"></span> {{.T "nav.home"}}</a>
      <a class="nav-link{{if eq .Nav "about"}} active{{end}}" href="/about"><span class="icon-[lucide--info]"></span> {{.T "nav.about"}}</a>
    </nav>
    <div class="flex items-center gap-1 text-sm" role="group" aria-label="{{.T "language.switch"}}">
      <span class="sr-only">{{.T "language.label"}}</span>
      {{range .Languages}}
      <a class="nav-link{{if .Current}} active{{end}}" href="{{.URL}}" hreflang="{{.Tag}}" lang="{{.Tag}}"{{if .Current}} aria-current="true"{{end}}>{{.Name}}</a>
      {{end}}
    </div>
  </div>
</header>
{{end}}
