name: Version tag

# name is the Actions title. It is not the filename. The four titles are
# Test suite, Default branch, Container image, and Version tag. Do not set
# name back to the filename.
#
# A semver tag runs version, then tests, then the same docker publish main
# uses, then a GitHub Release. The release is created only after the image
# push has succeeded, so the release page does not advertise an image tag
# that failed to push. action-gh-release updates the existing release for
# this tag on a re-run.
#
# There is no binary archive. Do not add the six-target archive job,
# SHA256SUMS, or a files upload. The release body is the image-tag policy,
# and generate_release_notes appends GitHub's generated notes after that
# body. The release name is the git tag (v1.2.3-rc.1), not the stripped
# version, so the title matches the ref that was pushed.
#
# prerelease is a boolean input, so the expression is a comparison
# (== 'true'). make_latest is a string enum (true / false / legacy), not a
# boolean, and GitHub expressions have no ternary. The expression
# prerelease == 'true' && 'false' || 'true' yields the string false for a
# pre-release and the string true for a stable tag, because any non-empty
# string is truthy, including the string false. A pre-release cannot be the
# repository's latest release. draft is left unset. This repository does not
# use immutable releases, so the release is published as soon as it is
# created and release.prereleased still fires. The release job does not
# check out. Checkout depth elsewhere stays at the default.
#
# version runs first and does not check out, so a tag the glob accepts but
# semver rejects (v01.2.3, v1.2.3-, v1.2.3-rc.01, v1.2.3-01) fails in seconds,
# before tests or either platform build. Job outputs do not pass through
# test, so the release job needs version directly for the version string and
# the prerelease flag. The version job sets no job-level permissions. It
# does not check out and its steps do not use the token. Omitting the key
# leaves it on the workflow ceiling.
#
# The trigger filter is a GitHub glob, not a regex, and it is matched against
# the whole tag. Quotes are required because [ is special in YAML. The first
# pattern does not match v1.2.3-rc.1; the suffix needs the second pattern.
# The glob is wider than semver on purpose. It is only a cheap event filter.
# A bare 1.2.3 with no v does not match, and neither does build metadata
# (v1.2.3+build). + is awkward in git refs and illegal in a Docker tag.
# Pre-release suffixes use -.
#
# The version job is bash and grep -Eq, with no checkout and no Go. ${TAG#v}
# is bash prefix removal of a literal v. TAG is an environment variable so
# the ref is not interpolated into the script. if ! grep is required under
# set -euo pipefail: a non-matching grep exits 1, and without the if the
# script would die before the error line. metadata-action rejects the same
# leading-zero forms. Catching them here avoids an empty tag list later.
#
# Matrix fail-fast stays at the default inside build-image.yml. One arch
# that does not build stops the other. Checkout depth stays at the default.
# Do not set fetch-depth: 0. metadata-action reads the tag from GITHUB_REF.
#
# cancel-in-progress is false so this file's own group does not cancel a tag
# build. ci.yml still sets it true, so force-pushing the same tag can
# cancel the in-progress release through the test group. There is no
# workflow_dispatch: a manual run would publish whatever tag filter happened
# to match, from an arbitrary ref.
#
# The runner is ubuntu-26.04, not ubuntu-latest. The workflow ceiling uses
# contents: write because creating a release needs it. Job permissions
# replace that set; they do not merge. test and docker repeat contents: read
# and must not inherit contents: write. packages, id-token, attestations,
# and actions: write are what build-image.yml needs for the push, the
# manifest attestation, and its caches (runtime image layers, the Go build
# cache, and the Bun package cache). The attestation is not pushed to GHCR.
# The release job keeps only
# contents: write. softprops/action-gh-release v2 is the last Node 20
# release and is unmaintained; this file uses v3.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Validate semver tag
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          # Numeric identifiers: 0 or [1-9][0-9]*. Other pre-release
          # identifiers must contain a letter or hyphen (rc, rc.1, alpha).
          # Rejects v01.2.3, v1.2.3-01, v1.2.3-rc.01, v1.2.3+build.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if [ "${TAG}" = "${ver}" ] || ! printf '%s\n' "${ver}" | grep -Eq "${semver}"; then
            echo "::error::${TAG} is not a supported semver tag (example: v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi
          pre=false
          case "${ver}" in
            *-*) pre=true ;;
          esac
          printf 'version=%s\n' "${ver}" >> "${GITHUB_OUTPUT}"
          printf 'prerelease=%s\n' "${pre}" >> "${GITHUB_OUTPUT}"

  test:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  docker:
    needs: test
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      actions: write
    uses: ./.github/workflows/build-image.yml

  release:
    needs: [version, docker]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          # String enum, not a boolean. Yields the string false for a pre-release.
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          body: |
            Docker image: `ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}`

            Stable tags also publish `major.minor` and `major` image tags. Floating tags that are only a leading zero (`0`, `0.0`) are omitted. Pre-release tags (for example `-rc.1`, `-beta.2`, `-alpha`) publish the full version only and are marked as GitHub pre-releases.
